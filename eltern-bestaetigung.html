<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Registrierung bestätigen — Galoppal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #220C10;
    --green: #1F3D2E;
    --green-dark: #16291F;
    --blue: #4C6A80;
    --surface: #FAF8F3;
    --card: #FFFFFF;
    --danger: #B3261E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', Arial, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(34, 12, 16, .08);
    padding: 36px 30px 30px;
    text-align: center;
  }
  .icon {
    width: 56px; height: 56px;
    margin: 0 auto 18px;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(31, 61, 46, .12);
    font-size: 26px;
  }
  .icon.error { background: rgba(179, 38, 30, .1); }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 500;
    font-size: 24px;
    margin: 0 0 10px;
    letter-spacing: -.2px;
  }
  p {
    font-size: 14px;
    line-height: 1.55;
    color: rgba(34, 12, 16, .65);
    margin: 0 0 6px;
  }
  .child-name { font-weight: 700; color: var(--ink); }
  .checks {
    text-align: left;
    margin: 22px 0;
    padding: 16px 16px 4px;
    background: rgba(76, 106, 128, .08);
    border-radius: 12px;
  }
  .check {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin-bottom: 12px;
    font-size: 12.5px;
    line-height: 1.5;
    color: rgba(34, 12, 16, .75);
  }
  .check input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--green); flex: none; }
  button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    color: #fff;
    background: var(--green);
    cursor: pointer;
    margin-top: 6px;
    transition: background .15s ease, opacity .15s ease;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:not(:disabled):hover { background: var(--green-dark); }
  .error-text { color: var(--danger); font-size: 13px; margin-top: 14px; }
  .revoke-link { display: block; margin-top: 22px; font-size: 11.5px; color: rgba(34, 12, 16, .4); }
  .revoke-link a { color: inherit; }
  .spinner {
    width: 22px; height: 22px; margin: 8px auto 0;
    border: 2.5px solid rgba(31, 61, 46, .2);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="spinner"></div>
  </div>

  <!-- Gleiches Supabase-Projekt wie config.js in diesem Ordner (Anon-Key ist
       ein öffentlicher Client-Key, geschützt wird über RLS — hier zusätzlich
       durch die eigens gesperrte Tabelle guardian_consents, siehe
       ../TrainAlign_Flutter/supabase/child_consent.sql). -->
  <script src="./vendor/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://vklfohuxyplsvdhmvmhb.supabase.co';
    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZrbGZvaHV4eXBsc3ZkaG12bWhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDQxMzIsImV4cCI6MjEwMjcyMDEzMn0.4I1409zuNkcrihuYMANS4D56RANCnNAJSkmdyA0ftfo';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const card = document.getElementById('card');
    const token = new URLSearchParams(location.search).get('token');

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    function renderError(message) {
      card.innerHTML = `
        <div class="icon error">⚠️</div>
        <h1>Das hat nicht geklappt</h1>
        <p>${escapeHtml(message)}</p>
      `;
    }

    function renderForm() {
      card.innerHTML = `
        <div class="icon">🐴</div>
        <h1>Registrierung bestätigen</h1>
        <p>Ihr Kind hat sich bei Galoppal registriert — einer App zur
        Organisation von Reitstunden. Bitte bestätigen Sie die beiden Punkte
        unten, um die Registrierung freizugeben.</p>
        <div class="checks">
          <label class="check">
            <input type="checkbox" id="chk-guardian" />
            <span>Ich bin erziehungsberechtigt für das Kind, das dieses Konto angelegt hat.</span>
          </label>
          <label class="check">
            <input type="checkbox" id="chk-consent" />
            <span>Ich willige in die Verarbeitung der Daten meines Kindes ein
            <strong>und</strong> stimme dem Vertragsschluss / den Buchungen
            meines Kindes über Galoppal zu.</span>
          </label>
        </div>
        <button id="confirm-btn" disabled>Bestätigen</button>
        <div id="form-error" class="error-text"></div>
      `;
      const guardian = document.getElementById('chk-guardian');
      const consent = document.getElementById('chk-consent');
      const btn = document.getElementById('confirm-btn');
      const errEl = document.getElementById('form-error');
      function sync() { btn.disabled = !(guardian.checked && consent.checked); }
      guardian.addEventListener('change', sync);
      consent.addEventListener('change', sync);
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = 'Wird bestätigt …';
        errEl.textContent = '';
        try {
          const { data, error } = await client.rpc('confirm_guardian_consent', {
            p_token: token,
          });
          if (error) throw error;
          const row = Array.isArray(data) ? data[0] : data;
          renderSuccess(row);
        } catch (e) {
          errEl.textContent = e.message || String(e);
          btn.disabled = false;
          btn.textContent = 'Bestätigen';
        }
      });
    }

    function renderSuccess(row) {
      const name = escapeHtml(row?.full_name || 'Ihr Kind');
      const revokeLink = row?.revoke_token
        ? `<a href="./eltern-widerruf.html?token=${encodeURIComponent(row.revoke_token)}">Einwilligung widerrufen</a>`
        : '';
      card.innerHTML = `
        <div class="icon">✅</div>
        <h1>Vielen Dank!</h1>
        <p>Die Einwilligung für <span class="child-name">${name}</span> wurde bestätigt.
        Das Konto ist jetzt freigeschaltet.</p>
        ${revokeLink ? `<span class="revoke-link">Meinung geändert? ${revokeLink}</span>` : ''}
      `;
    }

    if (!token) {
      renderError('Dieser Link ist unvollständig — bitte den Link aus der E-Mail vollständig öffnen.');
    } else {
      renderForm();
    }
  </script>
</body>
</html>
